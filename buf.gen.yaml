# TypeScript for both the Node server and the browser, from one contract.
version: v2
inputs:
  - directory: proto
plugins:
  - local: protoc-gen-es
    out: gen
    # erasable_syntax: enums as `as const` objects, not TypeScript enums, so Node
    # can run the generated code by stripping types (no build step).
    opt: [target=ts, import_extension=ts, erasable_syntax=true]
